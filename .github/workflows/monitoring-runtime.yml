name: Monitoring runtime

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify monitoring alert rules
        run: |
          docker run --rm --network none -v "$PWD/deploy:/deploy:ro" \
            --entrypoint promtool prom/prometheus:v3.16.0 test rules /deploy/tests/monitoring-rules-test.yml
      - name: Verify deployment contracts
        run: python3 -IB deploy/tests/monitoring-deploy-test.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sub2api-monitoring-smoke:ci
          cache-from: type=gha,scope=monitoring-smoke
          cache-to: type=gha,scope=monitoring-smoke,mode=max
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
      - name: Verify fresh monitoring installation and datasource permissions
        run: python3 -B deploy/tests/monitoring-stack-smoke.py --image sub2api-monitoring-smoke:ci
      - name: Verify controlled gateway traffic reaches metrics and PostgreSQL
        run: python3 -B deploy/tests/monitoring-v2-deploy-smoke.py --image sub2api-monitoring-smoke:ci --output-dir "$RUNNER_TEMP"
