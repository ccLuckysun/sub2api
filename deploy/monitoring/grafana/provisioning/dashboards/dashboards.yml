# =============================================================================
# Grafana 看板 provisioning provider
# =============================================================================
# 看板 JSON 位于仓库 deploy/monitoring/grafana/dashboards；compose 将当前三张
# 纯 Prometheus V2 JSON 逐文件只读挂载到 /etc/grafana/dashboards/v2（独立于
# grafana_data 持久卷，升级不会受旧卷残留影响），provider 只扫描该目录（不整目录
# 挂载，backup/ 下的旧 V1 JSON 不会被加载）。provisioned 看板以 Git 文件为权威，
# 页面手工改动重启后会被覆盖（迭代流程：改 build-dashboards.py -> 重新生成 -> 校验）。
# =============================================================================
apiVersion: 1

providers:
  - name: Sub2API
    orgId: 1
    folder: Sub2API
    folderUid: sub2api-folder
    type: file
    disableDeletion: false
    # Grafana 文件 provider 每 30s 扫描一次 v2 目录。同 inode 原地写入的 JSON
    # 最多 30s 生效；若安装工具通过 rename 替换 inode，必须重建 Grafana 文件绑定。
    # 部署脚本已显式 force-recreate；常规扫描保持 30s，避免小机器频繁重载。
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/v2
