# =============================================================================
# Grafana 数据源 provisioning - Prometheus
# =============================================================================
# url 用容器服务名（compose 网内 DNS），非 localhost；
# uid 固定 sub2api-prometheus，看板面板显式引用该 uid，不依赖默认数据源。
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: sub2api-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
