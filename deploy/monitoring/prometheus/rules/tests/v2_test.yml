            {
              "exp_labels": {
                "job": "sub2api",
                "instance": "a",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Sub2apiTargetDown",
                "description": "实例 a：Sub2apiTargetDown；请结合 V2 看板与样本核实。"
